<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando disco... | Archivo del Rap Argentino</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #09090b;
      --text-muted: #71717a;
      --border: #e4e4e7;
      --border-subtle: #f4f4f5;
      --badge-bg: #f4f4f5;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
      --btn-hover: #27272a;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    .top-nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background-color 0.15s ease;
    }

    .back-link:hover { background-color: var(--border-subtle); }

    .nav-links { display: flex; gap: 16px; }

    .nav-link {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-link:hover { color: var(--text); }

    .container {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .loading-state, .error-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .detail-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }

    /* Columna Izquierda */
    .album-cover-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--border-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-meta-box {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      background-color: var(--surface);
    }

    .meta-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .meta-item:last-child { margin-bottom: 0; }
    .meta-label { color: var(--text-muted); }
    .meta-value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }

    /* Columna Derecha */
    .album-header { margin-bottom: 24px; }

    .album-header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 6px;
    }

    .album-header .artist-line {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .player-container {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: transparent;
      margin-bottom: 24px;
      min-height: 200px;
    }

    .player-container.bandcamp-active {
      min-height: 650px;
      border: none;
    }

    .player-container iframe {
      width: 100%;
      border: none;
      display: block;
    }

    .btn-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .btn-external {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 6px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }

    .btn-external:hover { background-color: var(--btn-hover); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 6px;
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background-color: var(--border-subtle);
      border-color: #000000;
    }

    /* Módulo de Tracklist */
    .tracklist-box {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      background-color: var(--surface);
    }

    .tracklist-box h3 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .tracklist-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      transition: background-color 0.15s ease;
      user-select: none;
    }

    .track-row.interactive {
      cursor: pointer;
    }

    .track-row.interactive:hover {
      background-color: var(--border-subtle);
      color: #000000;
    }

    .track-title-col {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .track-num {
      color: var(--text-muted);
      font-size: 0.8rem;
      width: 24px;
    }

    .track-time {
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
      background-color: var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="back-link">← Volver al catálogo</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Catálogo</a>
      <a href="acerca.html" class="nav-link">Acerca del Archivo</a>
      <a href="colaborar.html" class="nav-link">Colaborar</a>
    </div>
  </nav>

  <main class="container">
    <div id="statusMessage" class="loading-state">Cargando información del disco...</div>

    <div id="detailView" class="detail-grid" style="display: none;">
      <!-- Izquierda -->
      <div>
        <div class="album-cover-box" id="coverBox">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Sin carátula</span>
        </div>
        <div class="album-meta-box">
          <div class="meta-title">Ficha Técnica</div>
          <div class="meta-item">
            <span class="meta-label">Año de salida</span>
            <span class="meta-value" id="metaYear">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Ubicación</span>
            <span class="meta-value" id="metaLocation">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Crew / Sello</span>
            <span class="meta-value" id="metaCrew">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Plataforma</span>
            <span class="meta-value" id="metaPlatform">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">ID Archivo</span>
            <span class="meta-value" id="metaId">-</span>
          </div>
        </div>
      </div>

      <!-- Derecha -->
      <div>
        <header class="album-header">
          <h1 id="albumTitle">-</h1>
          <div class="artist-line" id="artistName">-</div>
        </header>

        <div class="player-container" id="playerBox"></div>

        <div class="btn-action-row">
          <a id="btnExternal" href="#" target="_blank" rel="noopener noreferrer" class="btn-external">
            Escuchar en la plataforma original ↗
          </a>
          <a id="btnCompletar" href="#" class="btn-secondary">
            Completar o proponer cambios ✎
          </a>
        </div>

        <div id="tracklistBox" class="tracklist-box" style="display: none;">
          <h3>Lista de temas</h3>
          <div id="tracklistItems" class="tracklist-items"></div>
