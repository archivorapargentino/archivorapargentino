<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo del Rap Argentino | Catálogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #09090b;
      --text-muted: #71717a;
      --border: #e4e4e7;
      --border-subtle: #f4f4f5;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      outline: none;
      background-color: var(--surface);
      color: var(--text);
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--text);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .sort-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-box label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .sort-box select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }

    .album-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .album-card:hover {
      transform: translateY(-2px);
      border-color: var(--text-muted);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--border-subtle);
      position: relative;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 8px;
    }

    .card-year {
      background-color: var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .card-year:hover {
      background-color: var(--border);
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Archivo del Rap Argentino</h1>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">Catálogo</a>
      <a href="acerca.html" class="nav-link">Acerca del Archivo</a>
      <a href="colaborar.html" class="nav-link">Colaborar</a>
    </div>
  </header>

  <main class="container">
    <div class="controls-bar">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar artista, disco, año o ubicación...">
      </div>

      <div class="sort-box">
        <label for="sortSelect">Ordenar por:</label>
        <select id="sortSelect">
          <option value="newest" selected>Más recientes</option>
          <option value="oldest">Más antiguos</option>
          <option value="alpha">Alfabético</option>
        </select>
      </div>
    </div>

    <div id="catalogGrid" class="catalog-grid">
      <div class="loading-state">Cargando catálogo...</div>
    </div>
  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZNghTmjK_REV-NhXcsRMUu9m7s5JdESisakhIFD1Lm9P3xIoin-iea89nR6xKpQ/pub?output=csv';

    let globalAlbums = [];

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
      }
      return rows;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|v\/|shorts\/))([\w-]{11})/);
      return match ? match[1] : null;
    }

    async function loadCatalog() {
      const grid = document.getElementById('catalogGrid');
      
      const urlParams = new URLSearchParams(window.location.search);
      const searchQueryParam = urlParams.get('search');
      if (searchQueryParam) {
        document.getElementById('searchInput').value = searchQueryParam;
      }

      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('No se pudo conectar con la base de datos.');
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length === 0) {
          grid.innerHTML = '<div class="empty-state">La planilla está vacía.</div>';
          return;
        }

        let startIndex = 0;
        const firstCell = (rows[0][0] || '').toLowerCase();
        if (firstCell.includes('catálogo') || firstCell.includes('catalogo') || firstCell.includes('artista')) {
          startIndex = 1;
        }

        globalAlbums = [];
        for (let i = startIndex; i < rows.length; i++) {
          const cols = rows[i];
          if (!cols || cols.length === 0) continue;

          let rawTitle = (cols[0] || '').replace(/^Hoja \d+\s*/i, '').trim();
          let year = (cols[1] || '').trim();
          let link = (cols[2] || '').trim();
          let manualCover = (cols[3] || '').trim();
          let tracklistData = (cols[4] || '').trim();
          let location = (cols[5] || '').trim();
          let crew = (cols[6] || '').trim();

          let artist = rawTitle;
          let album = rawTitle;

          if (rawTitle.includes(' - ')) {
            const parts = rawTitle.split(' - ');
            artist = parts[0].trim();
            album = parts.slice(1).join(' - ').replace(/\(\d{4}\??\)/g, '').trim();
          }

          let firstTrackId = '';
          if (tracklistData && tracklistData.includes('|')) {
            const firstLine = tracklistData.split(/[\r\n]+/)[0];
            if (firstLine.includes('|')) {
              firstTrackId = firstLine.split('|')[1].trim().replace(/[^a-zA-Z0-9_-]/g, '');
            }
          }

          let coverUrl = manualCover;
          if (!coverUrl) {
            const ytId = extractYouTubeId(link) || firstTrackId;
            if (ytId) {
              coverUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            }
          }

          globalAlbums.push({
            originalIndex: i,
            artist: artist,
            album: album,
            year: year || 'S/D',
            link: link,
            cover: coverUrl,
            location: location,
            crew: crew
          });
        }

        renderCatalog();

      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Error al cargar el catálogo: ${err.message}</div>`;
      }
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortType = document.getElementById('sortSelect').value;

      let filtered = globalAlbums.filter(item => {
        return item.artist.toLowerCase().includes(searchTerm) ||
               item.album.toLowerCase().includes(searchTerm) ||
               item.year.toLowerCase().includes(searchTerm) ||
               item.location.toLowerCase().includes(searchTerm) ||
               item.crew.toLowerCase().includes(searchTerm);
      });

      if (sortType === 'newest') {
        filtered.sort((a, b) => b.originalIndex - a.originalIndex);
      } else if (sortType === 'oldest') {
        filtered.sort((a, b) => a.originalIndex - b.originalIndex);
      } else if (sortType === 'alpha') {
        filtered.sort((a, b) => a.artist.localeCompare(b.artist));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No se encontraron discos que coincidan con la búsqueda.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="album-card" onclick="window.location.href='disco.html?id=${item.originalIndex}'">
          <div class="card-cover">
            ${item.cover ? `<img src="${item.cover}" alt="${item.album}" loading="lazy">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:0.8rem;">Sin carátula</div>`}
          </div>
          <div class="card-body">
            <div>
              <div class="card-title">${item.album}</div>
              <div class="card-artist">${item.artist}</div>
            </div>
            <div class="card-footer">
              <span>#${item.originalIndex}</span>
              <a href="index.html?search=${encodeURIComponent(item.year)}" class="card-year" onclick="event.stopPropagation()">${item.year}</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderCatalog);
    document.getElementById('sortSelect').addEventListener('change', renderCatalog);

    loadCatalog();
  </script>
</body>
</html>
