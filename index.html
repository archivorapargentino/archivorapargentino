<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://open.spotify.com https://api.microlink.io https://soundcloud.com https://bandcamp.com https://*.bandcamp.com; frame-src 'self' https://www.youtube.com https://youtube.com https://open.spotify.com https://w.soundcloud.com https://bandcamp.com https://*.bandcamp.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo del Rap Argentino</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Archivo del Rap Argentino">
  <meta property="og:description"
    content="Catálogo discográfico histórico y contemporáneo del hip hop argentino (1989-presente).">
  <meta property="og:locale" content="es_AR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="top-nav">
    <a href="index.html" class="nav-link active">Catálogo</a>
    <a href="acerca.html" class="nav-link">Acerca del Archivo</a>
    <a href="colaborar.html" class="nav-link">Colaborar</a>
  </nav>

  <header>
    <div class="header-inner">
      <h1>Archivo del Rap Argentino</h1>
      <p>Catálogo discográfico histórico y contemporáneo</p>
    </div>
    <div id="headerMosaic" class="header-mosaic" aria-hidden="true"></div>
  </header>

  <div class="container">
    <div class="controls">
      <div class="top-controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar artista, disco, año, ubicación...">
        </div>
        <select id="sortSelect" class="sort-select" aria-label="Ordenar discos">
          <option value="desc" selected>Últimos agregados</option>
          <option value="year-desc">Más recientes (Hoy → 1989)</option>
          <option value="asc">Más antiguos (1989 → Hoy)</option>
          <option value="alpha">Artista (A → Z)</option>
        </select>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="90s">Años 90</button>
        <button class="filter-btn" data-filter="00s">Años 2000</button>
        <button class="filter-btn" data-filter="10s">Años 2010</button>
        <button class="filter-btn" data-filter="20s">Años 2020</button>
        <button class="filter-btn" data-filter="sin-fecha">Sin fecha</button>
      </div>
    </div>

    <div class="stats" id="statsDisplay">Conectando con Google Sheets...</div>
    <main class="grid" id="albumGrid"></main>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
